<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todo app</title>
  </head>
  <body>
    <script>
      // const container = document.createElement("div");
      // container.id = "container";
      // document.body.appendChild(container);
      // const span = document.createElement("span");
      // span.innerText = "Hello, World!";

      // remove
      // const remove = container.removeChild(span);
      // console.log(remove);

      /**
       * wrapper
       *  - header
       *    - title
       *    - counter
       *      - 'Total'
       *        0
       *      - 'Complete'
       *        0
       *  - input-field
       *    - input
       *    - button 'add'
       *  - item-list-container
       *    - ul
       *      - li
       *        - div
       *          - input(checkbox)
       *          - span
       *          - button 'remove'
       */
      // const wrapper = document.createElement("div");
      // const header = document.createElement("header");
      // const inputField = document.createElement("div");
      // const itemListContainer = document.createElement("div");

      // wrapper.appendChild(header);
      // wrapper.appendChild(inputField);
      // wrapper.appendChild(itemListContainer);
      // document.body.appendChild(wrapper);

      const app = createElement({
        tagName: "div",
        properties: { id: "app" },
        parent: document.body,
      });

      const header = createElement({
        tagName: "div",
        properties: { id: "header" },
        parent: app,
        children: [
          { tagName: "h1", properties: { innerText: "To-do list" } },
          {
            tagName: "div",
            properties: { id: "counter" },
            children: [
              { tagName: "span", properties: { innerText: "Total :" } },
              { tagName: "span", properties: { innerText: "0" } },
              { tagName: "span", properties: { innerText: "Completed :" } },
              { tagName: "span", properties: { innerText: "0" } },
            ],
          },
        ],
      });

      const inputField = createElement({
        tagName: "div",
        properties: { id: "input-field" },
        parent: app,
        children: [
          {
            tagName: "input",
            properties: { placeholder: "할일을 입력해주세요..." },
          },
          {
            tagName: "button",
            properties: { innerText: "Add" },
          },
        ],
      });

      const itemListContainer = createElement({
        tagName: "div",
        properties: { id: "item-list-container" },
        parent: app,
        children: [
          {
            tagName: "ul",
            properties: { id: "item-list" },
          },
        ],
      });

      // 인라인 스타일
      // app.style.background = "#000";
      // app.style.setProperty("background", "#000");
      // app.style.cssText = `
      //   background: #000;
      //   color: #fff;
      //   padding: 20px;
      // `;
      // app.style.removeProperty("background");

      // 스타일시트
      // document.styleSheets[0].insertRule(`#app {
      //     background: #000;
      //     color: #fff;
      //     padding: 20px;
      //   }`);
      // console.log(getComputedStyle(app));
      // document.styleSheets[0].deleteRule(0);

      // 동적으로 생성
      const stylesheet = new CSSStyleSheet();
      stylesheet.replace(` * {
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        background: linear-gradient(
          180deg,
          #3ac6f3 0%,
          rgba(200, 180, 180, 0.4) 40%,
          rgba(255, 0, 0, 0.56) 100%
        );
        overflow: hidden;
      }

      #app {
        background: #fff;
        max-width: 500px;
        width: 100%;
        margin: 100px auto;
        padding: 20px;
        border-radius: 6px;
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1);
      }

      #header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #counter span {
        margin-right: 0.5rem;
      }

      #input-field {
        margin: 20px 0;
        width: 100%;
        display: flex;
        height: 2.5rem;
      }

      #input-field input {
        width: 85%;
        height: 100%;
        border-radius: 3px;
        border: 1px solid #ccc;
        font-size: 0.8rem;
        padding-left: 15px;
        outline: none;
      }

      #input-field input:focus {
        border-color: #ff0051;
      }

      #input-field button {
        width: 50px;
        height: 100%;
        border: none;
        color: #fff;
        margin-left: 5px;
        font-size: 21px;
        outline: none;
        background: #3ac6f3;
        border-radius: 3px;
      }

      #input-field button:hover {
        background: #ff0051;
      }

      #item-list-container {
        max-height: 250px;
        overflow: scroll;
        scrollbar-width:none;
      }

      #item-list-container li {
        position: relative;
        display: flex;
        justify-content: space-between;
        list-style: none;
        height: 3rem;
        line-height: 3rem;
        margin-bottom: 0.5rem;
        overflow: hidden;
        border-radius: 5px;
      }

      #item-list-container div {
        width: 100%;
        display: flex;
        justify-content: space-between;
      }
      #item-list-container input {
        margin: 1rem;
        transition-duration: 0.5s;
        opacity: 1;
      }
      #item-list-container button {
        width: 3rem;
        margin: 0.3rem 1rem;
        width: 3rem;
        border: none;
        color: #fff;
        margin-left: 5px;
        font-size: 0.8rem;
        font-weight: bold;
        outline: none;
        background: #f97;
        border-radius: 3px;
        transition-duration: 0.5s;
        opacity: 1;
      }
      #item-list-container button:hover {
        background-color: #ddd;
      }
      #item-list-container span {
        width: 100%;
        text-align: 'left';
      }`);
      document.adoptedStyleSheets = [stylesheet];

      // 이벤트
      const addButton = document.querySelector("#input-field button");
      addButton.addEventListener("click", () => {
        const inputText = addButton.previousSibling.value;

        if (validCheck(inputText)) {
          return;
        }

        addItem(
          registerEvents(
            createElement({
              tagName: "li",
              children: [
                { tagName: "input", properties: { type: "checkbox" } },
                {
                  tagName: "span",
                  properties: { innerText: inputText },
                },
                { tagName: "button", properties: { innerText: "삭제" } },
              ],
            })
          )
        );

        updateCounter();
      });

      function validCheck(inputText) {
        inputText = inputText.trim();

        if (inputText === "") {
          alert("할일을 입력해주세요!");
          return false;
        }

        const itemContainer = document.querySelector("#item-list-container ul");
        const found = Array.from(itemContainer.children).find(
          (child) => child.children[1].innerText === inputText
        );
        if (found) {
          alert("이미 존재하는 할일입니다!");
          return false;
        }

        return true;
      }

      function addItem(item) {
        const itemContainer = document.querySelector("#item-list-container ul");
        itemContainer.appendChild(item);
      }

      function registerEvents(item) {
        const [checkbox, text, removeButton] = item.children;

        checkbox.addEventListener("change", () => {
          checkbox.checked
            ? (text.style.textDecoration = "line-through")
            : text.style.removeProperty("text-decoration");

          updateCounter();
        });

        removeButton.addEventListener("click", () => {
          item.remove();
          updateCounter();
        });

        return item;
      }

      function updateCounter() {
        const counter = document.getElementById("counter");
        const itemContainer = document.querySelector("#item-list-container ul");
        counter.children[1].innerText = "" + itemContainer.children.length;
        const completeCount = Array.from(itemContainer.children).filter(
          (child) => child.firstChild.checked
        ).length;
        counter.lastChild.innerText = "" + completeCount;
      }

      function createElement({
        tagName,
        properties,
        parent,
        children,
        count = 1,
      }) {
        const create = () => {
          const element = document.createElement(tagName);
          Object.assign(element, properties);
          parent?.appendChild(element);
          children?.map((child) => {
            child.parent = element;
            createElement(child);
          });

          return element;
        };

        if (count > 1) {
          const elements = [];
          for (let i = 0; i < count; i++) {
            elements.push(create());
          }
          return elements;
        } else {
          return create();
        }
      }
    </script>
  </body>
</html>
